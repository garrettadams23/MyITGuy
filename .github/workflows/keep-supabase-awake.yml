name: Keep Supabase DB awake

# Supabase auto-pauses free-tier projects after 7 days with no activity.
# This calls db-test (a real query against the database via the
# service-role client, not just a static health check) every 6 days so
# the project is never seen as idle.
#
# Note: GitHub disables scheduled workflows after 60 days with no commits
# to the repo - if pings stop firing, re-enable it from the Actions tab.
on:
  schedule:
    - cron: "17 14 */6 * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping database
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Query Supabase via the db-test function
        run: |
          http_code=$(curl -sS --max-time 30 -o response.json -w "%{http_code}" https://myitguy.netlify.app/api/db-test)
          cat response.json
          if [ "$http_code" -ne 200 ]; then
            echo "::error::db-test ping failed with HTTP $http_code"
            exit 1
          fi

      # Push a phone alert if the ping failed, so an outage is noticed
      # before a customer does. No-op unless the NTFY_TOPIC secret is set.
      # The run URL goes in a Click header (clean, whole-notification tap)
      # rather than the message body, where a trailing period used to get
      # glued onto the link and 404.
      - name: Alert on failure via ntfy
        if: failure() && env.NTFY_TOPIC != ''
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -s \
            -H "Title: ⚠️ MyITGuy db-test function failing" \
            -H "Tags: warning" \
            -H "Priority: 4" \
            -H "Click: $run_url" \
            -d "The live site's /api/db-test function returned an error. That points at the Netlify function or its env config - the Supabase database itself may be fine (see the db-health-check workflow for a direct DB verdict). Tap to open the Actions run." \
            "https://ntfy.sh/${NTFY_TOPIC}"
