name: Language Percentage Breakdown

# Manual trigger only. This used to run on every push/PR to Testing, which
# fired a full Ruby + github-linguist install dozens of times a day during
# routine syncs for a stat that rarely changes. Run it from the Actions tab
# when you actually want a fresh language breakdown.
on:
  workflow_dispatch:

jobs:
  analyze-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install GitHub Linguist
        run: gem install github-linguist

      - name: Calculate and Output Percentages
        run: |
          echo "Analyzing repository languages..."
          github-linguist --breakdown > linguist_stats.txt

          # Print to standard workflow log
          cat linguist_stats.txt

          # Publish to GitHub Actions Step Summary UI
          echo "### 📊 Code Language Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          cat linguist_stats.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
