        color: #111;

        padding: 24px;
        box-sizing: border-box;
      }
      .thanks-box h1 {
        font-size: 32px;
        margin: 0 0 12px;
      }
      .thanks-box h1 span {

      }
      .thanks-box p {

      }
      .thanks-box .btn {
        display: inline-block;
        background: crimson;
        color: #fff;
        padding: 12px 32px;
        border: 2px solid crimson;
        border-radius: 6px;
        text-decoration: none;
        transition: all 0.3s ease;
      }
      .thanks-box .btn:hover {
        background: none;
        color: crimson;
      }
